# Local development stack. Run from this folder: copy ../.env.example to .env, fill it in, then
#   docker compose up --build                     core stack: postgres, rabbitmq, gateway, parking, booking
#   docker compose --profile sim up --build       + IoT simulator (fake slot readings over MQTT)
#   docker compose --profile ai up --build        + AI service
#   docker compose --profile observability up ... + Aspire Dashboard (also set OTEL_EXPORTER_OTLP_ENDPOINT in .env)
#   docker compose --profile full up --build      everything, including the services that are still empty shells
# Dev-only ports listen on 127.0.0.1; other machines can reach only the gateway (8088) and MQTT (1883).
name: parking

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # empty: no logs/traces are exported
  MessageBrokerSettings__HostName: rabbitmq
  MessageBrokerSettings__UserName: ${RABBITMQ_USER}
  MessageBrokerSettings__Password: ${RABBITMQ_PASSWORD}
  Jwt__Issuer: parking-identity
  Jwt__PublicKey: ${JWT_PUBLIC_KEY}

# One database for the whole system; each service works in its own schema.
# GSS encryption is disabled: Npgsql tries it by default and the .NET runtime image has no libgssapi_krb5,
# which logs an error on every connection. Kerberos is not used here.
x-database-env: &database-env
  ConnectionStrings__DefaultConnection: Host=postgres;Database=parking_system;Username=app_svc;Password=${SERVICE_DB_PASSWORD};GSS Encryption Mode=Disable

x-infra-ready: &infra-ready
  postgres: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports: ["127.0.0.1:5433:5432"]   # 5432 is often taken by a locally installed PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:15672:15672"   # management UI
      - "127.0.0.1:5672:5672"     # AMQP, for services run outside Docker
      - "1883:1883"               # MQTT, reachable from IoT devices on the LAN
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  gateway:
    build: { context: .., dockerfile: gateway/Dockerfile }
    environment: *service-env
    ports: ["8088:8080"]   # 8080 is often taken on dev machines
    depends_on: [parking, booking]

  parking:
    build: { context: .., dockerfile: services/parking/Dockerfile }
    environment:
      <<: [*service-env, *database-env]
      Kestrel__Endpoints__Rest__Url: http://+:8080     # REST and SignalR (HTTP/1.1)
      Kestrel__Endpoints__Grpc__Url: http://+:8081     # gRPC (HTTP/2), internal network only
      Mqtt__Host: rabbitmq
      Mqtt__Username: ${RABBITMQ_USER}
      Mqtt__Password: ${RABBITMQ_PASSWORD}
    depends_on: *infra-ready

  booking:
    build: { context: .., dockerfile: services/booking/Dockerfile }
    environment:
      <<: [*service-env, *database-env]
      Grpc__Parking: http://parking:8081
    depends_on: *infra-ready

  # ---- optional: behind profiles ----

  identity:
    profiles: ["full"]
    build: { context: .., dockerfile: services/identity/Dockerfile }
    environment:
      <<: [*service-env, *database-env]
      Jwt__PrivateKey: ${JWT_PRIVATE_KEY}         # only identity can sign tokens
      Seed__UserName: ${SEED_USER_NAME:-}         # optional development account, see .env.example
      Seed__Password: ${SEED_USER_PASSWORD:-}
    depends_on: *infra-ready

  payment:
    profiles: ["full"]
    build: { context: .., dockerfile: services/payment/Dockerfile }
    environment:
      <<: [*service-env, *database-env]
      Kestrel__Endpoints__Rest__Url: http://+:8080     # REST (HTTP/1.1)
      Vnpay__TmnCode: ${VNPAY_TMN_CODE}
      Vnpay__HashSecret: ${VNPAY_HASH_SECRET}
      Vnpay__ReturnUrl: ${PUBLIC_BASE_URL}/payment/return
    depends_on: *infra-ready

  notification:
    profiles: ["full"]
    build: { context: .., dockerfile: services/notification/Dockerfile }
    environment:
      <<: [*service-env, *database-env]
      Smtp__Host: ${SMTP_HOST}
      Smtp__Username: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
    depends_on: *infra-ready

  ai:
    profiles: ["ai", "full"]
    build: { context: .., dockerfile: services/ai/Dockerfile }
    environment:
      GRPC_PORT: "8081"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OSRM_URL: https://router.project-osrm.org
    depends_on: *infra-ready

  iot-simulator:
    profiles: ["sim", "full"]
    build: ../edge/iot-simulator
    environment:
      MQTT_HOST: rabbitmq
      MQTT_USER: ${RABBITMQ_USER}
      MQTT_PASSWORD: ${RABBITMQ_PASSWORD}
      LOT_ID: 00000000-0000-0000-0000-000000000001
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: on-failure

  aspire-dashboard:
    profiles: ["observability", "full"]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"   # local development only; the UI listens on 127.0.0.1
    ports:
      - "127.0.0.1:18888:18888"   # dashboard UI
      - "127.0.0.1:18889:18889"   # OTLP/gRPC, for services run outside Docker

volumes:
  pgdata:
