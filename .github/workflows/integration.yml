name: integration

on:
  push:
    branches: [main, develop]
    paths:
      - tests/**
      - services/parking/**
      - services/booking/**
      - grpc_proto/**
      - shared/**
      - Directory.Build.props
      - Directory.Packages.props
      - nuget.config
      - .github/workflows/integration.yml
  pull_request:
    paths:
      - tests/**
      - services/parking/**
      - services/booking/**
      - grpc_proto/**
      - shared/**
      - Directory.Build.props
      - Directory.Packages.props
      - nuget.config
      - .github/workflows/integration.yml

permissions:
  contents: read

jobs:
  grpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - run: dotnet test tests/ParkingSystem.IntegrationTests -c Release
