syntax = "proto3";

package payment.v1;

option csharp_namespace = "ParkingSystem.Grpc.Payment";

// Queries the payment service answers for other services (internal network only, port 8081).
service PaymentService {
  // Checks if a vehicle plate has outstanding debt at a parking lot before entry (BR-05).
  rpc CheckDebt (CheckDebtRequest) returns (CheckDebtReply);
}

message CheckDebtRequest {
  string plate_number = 1;
  string lot_id = 2;
}

message CheckDebtReply {
  bool has_debt = 1;
  int64 amount = 2;
}
